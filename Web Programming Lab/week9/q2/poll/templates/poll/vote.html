<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Poll</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .poll-container { max-width: 450px; }
        .option-row { margin-bottom: 8px; display: flex; align-items: center; }
        .option-label { width: 120px; margin-left: 5px; }
        .result-label { color: #555; }
        .placeholder { color: #888; font-family: monospace; }
        hr { border: 0; border-top: 1px solid #ccc; margin-bottom: 20px; }
        button { padding: 5px 15px; margin-top: 15px; background-color: #e0e0e0; border: 1px solid #999; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #d0d0d0; }
    </style>
</head>
<body>

<div class="poll-container">
    <p>How is the book ASP.NET with c# by Vipul Prakashan?</p>
    <hr>

    <form method="POST">
        {% csrf_token %}
        
        <div class="option-row">
            <input type="radio" id="good" name="choice" value="good" {% if selected_choice == 'good' %}checked{% endif %} required>
            <label class="option-label" for="good">Good</label>
            {% if voted %}
                <span class="result-label">{{ good_pct }}%</span>
            {% else %}
                <span class="placeholder">[lblgood]</span>
            {% endif %}
        </div>

        <div class="option-row">
            <input type="radio" id="satisfactory" name="choice" value="satisfactory" {% if selected_choice == 'satisfactory' %}checked{% endif %}>
            <label class="option-label" for="satisfactory">Satisfactory</label>
            {% if voted %}
                <span class="result-label">{{ sat_pct }}%</span>
            {% else %}
                <span class="placeholder">[lblsatisfactory]</span>
            {% endif %}
        </div>

        <div class="option-row">
            <input type="radio" id="bad" name="choice" value="bad" {% if selected_choice == 'bad' %}checked{% endif %}>
            <label class="option-label" for="bad">Bad</label>
            {% if voted %}
                <span class="result-label">{{ bad_pct }}%</span>
            {% else %}
                <span class="placeholder">[lblbad]</span>
            {% endif %}
        </div>

        <button type="submit">Vote</button>
    </form>
</div>

</body>
</html>
